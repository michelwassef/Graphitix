name: Nightly Full Jest

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

concurrency:
  group: unit-jest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full Jest suite
        run: npm test -- --runInBand
