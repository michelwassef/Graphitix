name: Nightly Jest source coverage

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

concurrency:
  group: unit-jest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest source-coverage projects
        run: npm run test:lane -- --lane coverage --report-file artifacts/test-reports/coverage.json

      - name: Aggregate nightly test trend report
        if: always()
        run: node scripts/aggregate-test-trends.cjs --report artifacts/test-reports/coverage.json --coverage coverage/coverage-summary.json --artifact-root coverage --artifact-root artifacts/perf-summaries --output artifacts/test-reports/coverage-trend.json

      - name: Upload coverage lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage-report
          path: |
            artifacts/test-reports/coverage.json
            artifacts/test-reports/coverage-trend.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: coverage
          retention-days: 14
          if-no-files-found: ignore
