name: Fast Test Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and discovery contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static lane
        run: npm run test:lane -- --lane static --report-file artifacts/test-reports/static.json

      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-static
          path: |
            artifacts/test-reports/static.json
            artifacts/test-reports/static.manifest.json
            artifacts/test-reports/static.skips.json
          retention-days: 14
          if-no-files-found: error

  jest:
    name: Jest ${{ matrix.lane }} lane
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, dom, architecture, stats, workers, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Python oracle
        if: matrix.lane == 'stats'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-stats.txt

      - name: Install dependencies
        run: npm ci

      - name: Install statistical-oracle dependencies
        if: matrix.lane == 'stats'
        run: python -m pip install -r requirements-stats.txt

      - name: Validate statistical-oracle runtime
        if: matrix.lane == 'stats'
        run: npm run test:python:check

      - name: Run Jest lane
        run: npm run test:lane -- --lane ${{ matrix.lane }} --report-file artifacts/test-reports/${{ matrix.lane }}.json

      - name: Upload Jest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-jest-${{ matrix.lane }}
          path: |
            artifacts/test-reports/${{ matrix.lane }}.json
            artifacts/test-reports/${{ matrix.lane }}.manifest.json
            artifacts/test-reports/${{ matrix.lane }}.skips.json
            artifacts/test-reports/${{ matrix.lane }}.cases.json
          retention-days: 14
          if-no-files-found: error
