name: E2E Chromium Contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: e2e-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Chromium contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Chromium contracts
        run: npm run test:lane -- --lane e2e-contracts --report-file artifacts/test-reports/e2e-contracts.json

      - name: Upload required lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-e2e-contracts-chromium
          path: artifacts/test-reports/e2e-contracts.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload optional Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-contracts-chromium
          path: |
            playwright-report
            test-results
            artifacts/perf-summaries
          if-no-files-found: ignore
          retention-days: 14
