name: E2E Nightly Feature Matrix

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feature-matrix:
    name: Chromium feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run full workspace matrix
        run: npm run test:lane -- --lane e2e-matrix --report-file artifacts/test-reports/e2e-matrix.json

      - name: Run repeated randomized owner-order contracts
        run: npm run test:lane -- --lane e2e-owner-order --report-file artifacts/test-reports/e2e-owner-order.json

      - name: Aggregate nightly test trend report
        if: always()
        run: node scripts/aggregate-test-trends.cjs --report artifacts/test-reports/e2e-matrix.json --report artifacts/test-reports/e2e-owner-order.json --artifact-root test-results --artifact-root playwright-report --output artifacts/test-reports/e2e-trend.json

      - name: Upload required lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-e2e-matrix
          path: |
            artifacts/test-reports/e2e-matrix.json
            artifacts/test-reports/e2e-owner-order.json
            artifacts/test-reports/e2e-trend.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload optional Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-nightly-chromium
          path: |
            playwright-report
            test-results
            artifacts/perf-summaries
          if-no-files-found: ignore
          retention-days: 14
