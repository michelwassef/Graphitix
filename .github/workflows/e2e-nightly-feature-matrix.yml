name: E2E Nightly Feature Matrix

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feature-matrix:
    name: Chromium feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run full workspace matrix
        run: npm run test:e2e:matrix -- --project=chromium

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-nightly-chromium
          path: |
            playwright-report
            test-results
            artifacts/perf-summaries
          if-no-files-found: ignore
