name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release smoke and build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both the Pages build and the release smoke suite launch Playwright.
      # Install Chromium before either step so thumbnail regeneration during
      # pages:check can run on a clean GitHub Actions runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate and build static site
        run: npm run pages:check

      # PUBLICATION GATE: exercise every user-facing graph variant in a real browser.
      # The Pages artifact is not uploaded and the site is not published if this fails.
      - name: Run release rendering smoke tests
        run: npx playwright test e2e/release-rendering-smoke.spec.js --project=chromium --workers=1

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-rendering-smoke-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      # This is only reached if the Pages checks and release smoke gate succeeded.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
