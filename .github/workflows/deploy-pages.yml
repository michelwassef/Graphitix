name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ----------------------------------------------------------
      # PUBLICATION GATE
      # Nothing below this point is deployed if one of these fails.
      # ----------------------------------------------------------

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Run release rendering smoke tests
        run: npx playwright test e2e/release-rendering-smoke.spec.js --project=chromium --workers=1

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-rendering-smoke-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Validate and build static site
        run: npm run pages:check

      # This is only reached if ALL checks above succeeded.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4