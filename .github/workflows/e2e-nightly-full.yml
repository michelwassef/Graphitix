name: Nightly Full Browser Suite

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Full Chromium suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run full browser lane
        run: npm run test:lane -- --lane full-chromium --report-file artifacts/test-reports/full-chromium.json

      - name: Aggregate nightly test trend report
        if: always()
        run: node scripts/aggregate-test-trends.cjs --report artifacts/test-reports/full-chromium.json --artifact-root test-results --artifact-root playwright-report --artifact-root artifacts/perf-summaries --output artifacts/test-reports/full-chromium-trend.json

      - name: Upload required lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-full-chromium
          path: |
            artifacts/test-reports/full-chromium.json
            artifacts/test-reports/full-chromium-trend.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload optional Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-chromium
          path: |
            playwright-report
            test-results
            artifacts/perf-summaries
          if-no-files-found: ignore
          retention-days: 14
